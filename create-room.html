<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สร้างห้องเรียน — STU-Check</title>
  <meta name="description" content="กรอกข้อมูลวิชาเพื่อสร้างห้องเรียนใหม่">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/dashboard.html" class="logo">
      <div class="logo-icon">S</div>
      STU-Check
    </a>
    <div class="nav-links">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm">← กลับ</a>
    </div>
  </div>
</nav>

<div class="room-setup-page">
  <div class="card card-lg" style="width:100%;max-width:480px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:60px;height:60px;border-radius:16px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px">
        <i class="bi bi-building-fill" style="color:var(--primary)"></i>
      </div>
      <h1 style="font-size:1.75rem">สร้างห้องเรียน</h1>
      <p>กรอกข้อมูลวิชาเพื่อเปิดห้องเก็บข้อมูล</p>
    </div>

    <form id="create-room-form" class="form-stack" novalidate>
      <div class="form-group">
        <label class="form-label" for="subjectCode">รหัสวิชา <span style="color:var(--rose-600)">*</span></label>
        <input class="form-input" type="text" id="subjectCode" name="subjectCode"
          placeholder="เช่น CS101, TH301" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="subjectName">ชื่อวิชา <span style="color:var(--rose-600)">*</span></label>
        <input class="form-input" type="text" id="subjectName" name="subjectName"
          placeholder="เช่น คณิตศาสตร์พื้นฐาน" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="classroom">ห้องเรียน <span style="color:var(--rose-600)">*</span></label>
        <input class="form-input" type="text" id="classroom" name="classroom"
          placeholder="เช่น 3/1, ม.5/2, A301" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" id="create-submit-btn">
        <i class="bi bi-rocket-takeoff-fill"></i> สร้างห้องเรียน
      </button>
    </form>

    <div class="privacy-banner" style="margin-top:20px">
      <div class="privacy-banner-icon"><i class="bi bi-shield-lock-fill" style="color:var(--emerald)"></i></div>
      <div class="privacy-banner-text">
        <strong>Privacy-First:</strong> ระบบประมวลผลภาพบนเครื่องของนักเรียนเท่านั้น ไม่มีภาพถูกส่งมายังเซิร์ฟเวอร์ มีเพียงรหัสอารมณ์ (0/1/2) เท่านั้น
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/js/config.js"></script><script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/room.js"></script>
<script src="/js/settings.js"></script>
<script>initCreateRoomPage();</script>
</body>
</html>
