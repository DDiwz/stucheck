<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — STU-Check</title>
  <meta name="description" content="เข้าสู่ระบบ STU-Check">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <!-- Left panel -->
  <div class="auth-left">
    <div class="auth-left-content">
      <div class="logo" style="justify-content:center;color:white;margin-bottom:24px">
        <div class="logo-icon">S</div>
        STU-Check
      </div>
      <h1>ยินดีต้อนรับ<br>กลับมา</h1>
      <p style="margin-top:16px">ระบบติดตามอารมณ์นักเรียนแบบ Privacy-First สำหรับห้องเรียนยุคใหม่</p>
    </div>
  </div>

  <!-- Right panel -->
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2 class="auth-form-title">เข้าสู่ระบบ</h2>
      <p class="auth-form-sub">กรอก Username และ Password ที่สมัครไว้</p>

      <form id="login-form" class="form-stack" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username"
            placeholder="กรอก Username ของคุณ" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password"
            placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn">
          เข้าสู่ระบบ
        </button>
      </form>

      <p style="text-align:center;margin-top:20px;font-size:0.9rem;color:var(--text-2)">
        ยังไม่มีบัญชี? <a href="register.html" class="auth-link">สมัครสมาชิก</a>
      </p>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="js/config.js"></script><script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/settings.js"></script>
<script>initLoginPage();</script>
</body>
</html>
