<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าบัญชี — STU-Check</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="/dashboard.html" class="logo">
      <div class="logo-icon">S</div>
      STU-Check
    </a>
    <div class="nav-links">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm">← กลับแดชบอร์ด</a>
    </div>
  </div>
</nav>

<main class="dashboard-page" style="display:flex; justify-content:center; padding-top:60px;">
  <div class="card card-lg" style="width:100%; max-width:500px;">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:60px;height:60px;border-radius:16px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 16px">
        <i class="bi bi-gear-fill" style="color:var(--primary)"></i>
      </div>
      <h1 style="font-size:1.75rem">ตั้งค่าบัญชี</h1>
    </div>

    <form id="settings-form" class="form-stack" novalidate>
      <div class="form-group">
        <label class="form-label">Username</label>
        <div class="form-input" style="background:var(--bg); color:var(--text-2); cursor:not-allowed;" id="username-display"></div>
        <span class="form-hint">Username ไม่สามารถแก้ไขได้</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="displayName">ชื่อแสดงผล (Name)</label>
        <input class="form-input" type="text" id="displayName" name="displayName" placeholder="ชื่อที่ใช้แสดงในระบบ">
      </div>

      <div class="form-group">
        <label class="form-label" for="theme-select">โหมดการแสดงผล (Theme)</label>
        <select id="theme-select" class="form-input" style="cursor:pointer">
          <option value="light">☀️ โหมดสว่าง (Light Mode)</option>
          <option value="dark">🌙 โหมดมืด (Dark Mode)</option>
          <option value="system">🖥️ ตามโหมดของระบบปฏิบัติการ (System Default)</option>
        </select>
        <span class="form-hint">เลือกธีมและโหมดสีของเว็บไซต์ที่ต้องการใช้งาน</span>
      </div>

      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:20px;">
        <i class="bi bi-save"></i> บันทึกการตั้งค่า
      </button>
    </form>
  </div>
</main>

<div id="toast-container"></div>
<script src="/js/config.js"></script><script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/settings.js"></script>
<script>initSettingsPage();</script>
</body>
</html>
